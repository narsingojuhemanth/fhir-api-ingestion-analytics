name: Validate and package project

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate notebook JSON and Python syntax
        run: python tests/validate_notebooks.py

      - name: Create clean source ZIP
        run: |
          mkdir -p package/fhir-api-ingestion-analytics
          rsync -a \
            --exclude=".git/" \
            --exclude=".github/" \
            --exclude="*.zip" \
            --exclude="*.parquet" \
            --exclude="*.delta" \
            --exclude="raw/" \
            --exclude="data/" \
            --exclude="Files/raw/" \
            --exclude="page_*.json" \
            --exclude="page_*.metadata.json" \
            ./ package/fhir-api-ingestion-analytics/
          cd package
          zip -qr ../fhir-api-ingestion-analytics-project.zip fhir-api-ingestion-analytics

      - name: Publish ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: fhir-api-ingestion-analytics-project
          path: fhir-api-ingestion-analytics-project.zip
          retention-days: 30
